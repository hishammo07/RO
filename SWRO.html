<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CES SWRO Calculator</title>
<style>
:root{--bg:#f3eee4;--card:#fbf8f1;--card2:#ece5d6;--line:#d8cfba;--tx:#2b2a26;--mut:#6f6a5c;--am:#b4532a;--onacc:#fff8ee;--ok:#2f7d5b;--bad:#b3372f;--bar2:#3e7c82;--sw:#3e7c82;--brine:#8b6b3d;--sh:0 1px 2px rgba(60,45,20,.08)}
html[data-th=sea]{--bg:#e6efed;--card:#f5faf9;--card2:#d9e7e4;--line:#b9d1cc;--tx:#1d2d2b;--mut:#587270;--am:#0f766e;--onacc:#f2fffd;--ok:#2f7d4f;--bad:#b4472f;--bar2:#c2703a;--sw:#3b7fa6;--brine:#8a6a3a}
html[data-th=dark]{--bg:#1d1b18;--card:#27241f;--card2:#322e27;--line:#443d33;--tx:#eee8da;--mut:#a39b88;--am:#e0894f;--onacc:#201409;--ok:#74c398;--bad:#e5786e;--bar2:#6aa8ad;--sw:#6aa8ad;--brine:#c9a063;--sh:none}
body{transition:background .3s,color .3s}
.card,.s,.k,.tab,input,select{transition:background .3s,border-color .3s}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1400px;margin:auto;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 92%,transparent);backdrop-filter:blur(4px);padding:12px 14px 6px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{font-size:17px;color:var(--am)}
.brand span{font-size:12px;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.s{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:var(--sh)}
.s.g{border-top-color:var(--ok)}.s.g b{color:var(--ok)}
.s.m{border-top-color:var(--am)}.s.m b{color:var(--am)}
.s.r{border-top-color:var(--bad)}.s.r b{color:var(--bad)}
.s.n b{color:var(--tx)}
.s small{display:block;color:var(--mut);font-size:11px}
.s b{font-size:17px}
.s i{font-style:normal;font-size:11px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:112px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit}
.tab b{display:block;font-size:13px;color:var(--tx)}
.tab small{font-size:11px}
.tab.on{background:var(--am);border-color:var(--am)}
.tab.on b,.tab.on small{color:var(--onacc)}
.panel{display:none;padding:12px 14px}
.panel.on{display:block}
.lead{color:var(--mut);margin:6px 0 12px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.card h2{font-size:14px;color:var(--am);margin-bottom:2px}
.card .why{font-size:12px;color:var(--mut);margin-bottom:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600}
.fld .h{font-size:12px;color:var(--mut);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--am);border-color:var(--am)}
input:disabled{opacity:.5}
.u{min-width:62px;color:var(--mut);font-size:12px}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--am);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;width:100%}
.btn.p{background:var(--am);color:var(--onacc);font-weight:700;width:auto}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.desc{background:var(--card2);border-left:4px solid var(--am);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.desc b{color:var(--am)}
.hide{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.k span{font-size:11px;color:var(--mut);display:block}
.k b{font-size:19px;color:var(--am)}
.k small{font-size:11px;color:var(--mut)}
.al{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13px;border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.al.g{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--am)}
tr.sel td{background:color-mix(in srgb,var(--am) 16%,transparent)}
.wrap{overflow-x:auto}
.bl{margin-bottom:12px}
.bl div{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--am);border-radius:6px;transition:width .4s ease}
.bar.o i{background:var(--bar2)}
footer{text-align:center;color:var(--mut);font-size:11px;margin-top:22px}
input[type=checkbox]{width:auto;accent-color:var(--am)}
.chips{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.chips label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.pp{fill:none;stroke-width:7;stroke-linecap:round;opacity:.3}
.fl{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 14;animation:dash 1s linear infinite}
.fl.off{animation:none;opacity:0}
@keyframes dash{to{stroke-dashoffset:-16}}
.cw{stroke:var(--sw)}.ch{stroke:var(--am)}.cb{stroke:var(--brine)}.cp{stroke:var(--ok)}
.sh{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:6 5}
.nd{cursor:pointer}
.nd .bx{fill:var(--card2);stroke:var(--line);stroke-width:2;transition:stroke .2s}
.nd:hover .bx{stroke:var(--am)}
.nd.sel .bx{stroke:var(--am);stroke-width:4}
.nd text{fill:var(--tx);font:600 13px system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.nd text.s2{font-weight:400;font-size:11px;fill:var(--mut)}
.lb{fill:var(--tx);font:11px system-ui,sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.lg i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.gd{border-bottom:1px solid var(--line);padding:8px 0}
.gd summary{cursor:pointer;font-weight:600;color:var(--am)}
.gd p,.gd li{font-size:13px;margin:6px 0}
.gd ul{padding-inline-start:20px}
.gd code{direction:ltr;unicode-bidi:embed;background:var(--card2);padding:1px 6px;border-radius:6px;font-size:12px}
.en{unicode-bidi:isolate;direction:ltr}
.fm{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--card2);border-radius:8px;padding:9px 12px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.gbox{font-size:15px}
#gg{line-height:1.9}
#gg summary{font-size:15.5px;padding:4px 0}
.gd p,.gd li{font-size:14.5px;line-height:1.95}
.gd li{margin:8px 0}
.xin{text-align:left}
#rep{display:none;color:#1b2b4a;font:13px/1.5 Arial,Helvetica,sans-serif}
#rep.show{display:block;position:fixed;inset:0;z-index:100;background:#e6f1f7;overflow:auto}
#rep .tb{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:10px;background:#0b6e99}
#rep .tb button{border:0;border-radius:8px;padding:9px 16px;font:600 13px Arial;cursor:pointer;background:#f5a623;color:#0b6e99}
#rep .tb button.g{background:#fff}
#rep .tb .tip{color:#fff;font-size:12px;align-self:center;opacity:.85}
#rep .pg:focus{outline:none}
#rep .pg{max-width:1000px;margin:12px auto;background:#fff;padding:0 0 4px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#rep .hd{background:#0b6e99;color:#fff;padding:18px 14px;border-bottom:5px solid #f5a623;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#rep .hd h1{font-size:22px;letter-spacing:.3px}
#rep .hd span{font-size:11px;color:#f5a623;font-weight:700;text-align:right}
#rep .in{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid #cde3ee}
#rep .in div{padding:9px 14px;border-right:1px solid #cde3ee}
#rep .in div:last-child{border-right:0}
#rep .in small{display:block;color:#5b6b8c;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
#rep .in b{font-size:13px}
#rep .bd{padding:10px 12px}
#rep h2{font-size:13px;color:#0b6e99;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #f5a623;padding-bottom:3px;margin:14px 0 8px}
#rep .ks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#rep .rk{border:1px solid #cde3ee;border-left:5px solid #0b6e99;border-radius:6px;padding:9px 11px;background:#f2f9fd;break-inside:avoid}
#rep .rk span{display:block;font-size:9.5px;color:#5b6b8c;text-transform:uppercase}
#rep .rk b{font-size:19px;color:#0b6e99}
#rep .rk small{font-size:10px;color:#5b6b8c;font-weight:400}
#rep table{width:100%;border-collapse:collapse;font-size:12px}
#rep th{background:#0b6e99;color:#fff;padding:6px 8px;text-align:center;vertical-align:middle;font-weight:600;white-space:normal}
#rep td{padding:3.5px 8px;border-bottom:1px solid #dcecf4;text-align:center;vertical-align:middle;white-space:normal}
#rep tr:nth-child(even) td{background:#eef7fc}
#rep td.n,#rep th.n{text-align:center}
#rep tr.tt th{background:#fff;color:#0b6e99;font-size:13px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #f5a623;padding:10px 0 5px;text-align:left}
#rep .g2 tr.tt th{padding-top:0}
#rep tr.sel td{background:#fff1d6;font-weight:700}
#rep .g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#rep .g2{margin-top:14px}
#rep .g2 td:last-child{white-space:nowrap}
#rep .sv{border:1px solid #cde3ee;border-radius:8px;padding:4px;break-inside:avoid}
#rep .sv svg{width:100%;height:auto;display:block}
#rep .rb{height:8px;background:#dcecf4;border-radius:4px;overflow:hidden}
#rep .rb i{display:block;height:100%}
#rep .al{border-radius:6px;padding:7px 10px;margin-bottom:5px;font-size:12px;border:1px solid}
#rep .al.ok{background:#e4f6ec;border-color:#2f9e6b;color:#17623f}
#rep .al.no{background:#fde8e6;border-color:#c0392b;color:#8e2418}
#rep .ft{margin:6px 12px 0;padding-top:8px;border-top:2px solid #0b6e99;display:flex;justify-content:space-between;font-size:10px;color:#5b6b8c;gap:10px}
#rep .ft b{color:#0b6e99}
@media print{
body>*:not(#rep){display:none!important}
#rep.show{position:static;background:#fff;overflow:visible}
#rep .tb{display:none}
#rep .pg{max-width:none;margin:0;box-shadow:none}
@page{size:A4;margin:6mm}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rep h2{break-after:avoid}
#rep .sc,#rep .sv,#rep .rk,#rep .ts,#rep .g2{break-inside:avoid}
#rep tr{break-inside:avoid}
#rep .ft{break-before:avoid;break-inside:avoid}
#rep thead{display:table-header-group}
#rep tbody tr:first-child{break-before:avoid}
html,body{background:#fff!important}
}
.cd{stroke:#8a5fa8}
.bk{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bk small{display:block;color:var(--mut);font-size:11px}
.bk button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:12px;cursor:pointer;margin-inline-start:4px}
.gmodal{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,15,5,.5);padding:14px;overflow:auto}
.gmodal.on{display:block}
.gbox{max-width:720px;margin:16px auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.gr{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.gr>b{color:var(--am);word-break:break-word}
@media(max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
<div class="brand"><h1>SWRO Hydraulic & Energy Calculator</h1><span style="display:flex;gap:8px;align-items:center"><button class="btn" id="bbtn" style="width:auto;padding:5px 10px;font-size:12px" onclick="bo()">Backup</button><button class="btn p" id="xbtn" style="padding:5px 10px;font-size:12px" onclick="xo()">Export</button><button class="btn" id="gbtn" style="width:auto;padding:5px 10px;font-size:12px" onclick="go5()">Glossary</button><select id="theme" style="width:auto;padding:5px 8px;font-size:12px"><option value="auto">Theme: Auto</option><option value="sand">Sand</option><option value="sea">Sea</option><option value="dark">Charcoal</option></select></span></div>
<div class="strip" id="strip"></div>
<div class="tabs" id="tabs"></div>
</div>

<div class="panel" id="p0"></div>
<div class="panel" id="p1"></div>
<div class="panel" id="pD"></div>
<div class="panel" id="pS"></div>
<div class="panel" id="p2"></div>
<div class="panel" id="p3"></div>
<div class="panel" id="p4"></div>
<div class="gmodal" id="p5"></div>
<footer>Eng. Hesham Mohamed — CES</footer>

<script>
const $=i=>document.getElementById(i);
const NAMES={none:"No ERD",px:"Pressure Exchanger (PX)",turbo:"Turbocharger",pelton:"Pelton wheel"};
const DESC={
none:"<b>No ERD</b> — brine pressure is dumped. Highest energy; use only as a reference.",
px:"<b>Pressure Exchanger</b> — works in parallel with the HPP. Brine at ~60 bar pushes seawater directly in a rotor (95–98% efficient). A small booster lifts that flow to membrane pressure. Best SEC.",
turbo:"<b>Turbocharger</b> — installed <b>after the HPP and before the membranes</b>. A turbine on the brine line drives a pump on the same shaft that boosts the feed. Simple, no extra motor, ~60–70% overall.",
pelton:"<b>Pelton wheel</b> — brine jets spin a wheel on the HPP/motor shaft, reducing motor load. 80–88% efficient, common in older or large plants."};
const PRE={
src:{med:[39000,25],red:[41000,28],gulf:[45000,32],std:[35000,25]},
intake:{open:0.3,beach:0.15},
pump:{std:[82,75,94],high:[86,80,96]},
elem:{a400:37.2,a440:40.9,a365:33.9}
};

const T=[
["Plant Data","Water, capacity, membranes"],
["Equipment","ERD, pumps, cost"],
["Dosing","Chemicals & pumps"],
["Schematic","Interactive diagram"],
["Results","Energy & flows"],
["Pressure Map","Where every bar goes"],
["ERD Compare","PX vs Turbo vs Pelton"]
];
$("tabs").innerHTML=T.map((t,i)=>`<button class="tab" data-i="${i}"><b>${i+1}. ${t[0]}</b><small>${t[1]}</small></button>`).join("");

function fld(o){
 let inner;
 if(o.type==="sel")inner=`<select id="${o.id}">${o.opts.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select>`;
 else inner=`<div class="row"><input id="${o.id}" type="number" step="${o.step}" value="${o.def}"><span class="u" id="${o.id}_u">${o.unit||""}</span></div>`;
 return `<div class="fld ${o.cls||""}" ${o.for?`data-for="${o.for}"`:""}><label for="${o.id}">${o.label}</label><div class="h">${o.hint}</div>${inner}</div>`;
}
function card(t,w,fs,extra=""){return `<div class="card"><h2>${t}</h2><div class="why">${w}</div>${fs.map(fld).join("")}${extra}</div>`}
function nav(b,n){return `<div class="nav">${b!=null?`<button class="btn" style="width:auto" onclick="go(${b})">← ${T[b][0]}</button>`:"<span></span>"}${n!=null?`<button class="btn p" onclick="go(${n})">${T[n][0]} →</button>`:""}</div>`}

$("p0").innerHTML=`<div class="cards">`+
card("Feed water","Salinity and temperature set the pressure needed.",[
{id:"src",type:"sel",label:"Water source",hint:"Sets TDS and temperature",opts:[["med","Mediterranean (39,000 / 25°C)"],["red","Red Sea (41,000 / 28°C)"],["gulf","Arabian Gulf (45,000 / 32°C)"],["std","Standard seawater (35,000 / 25°C)"],["custom","Custom"]]},
{id:"tds",label:"Feed TDS",unit:"mg/L",def:39000,step:500,hint:"Higher TDS → higher pressure and SEC"},
{id:"temp",label:"Temperature",unit:"°C",def:25,step:0.5,hint:"Cold water needs more pressure"},
{id:"intake",type:"sel",label:"Intake type",hint:"Sets the other-auxiliaries preset",opts:[["beach","Beach well / seabed gallery"],["open","Open sea intake"],["custom","Custom"]]}
])+
card("Plant capacity","Sets all flows in the plant.",[
{id:"unit",type:"sel",label:"Capacity unit",hint:"Input unit",opts:[["h","m³/h"],["d","m³/day"]]},
{id:"cap",label:"Permeate capacity",unit:"m³/h",def:1000,step:10,hint:"Net product water"},
{id:"rec",label:"Recovery",unit:"%",def:45,step:0.5,hint:"Permeate ÷ feed. Typical SWRO 40–50%"},
{id:"rej",label:"Salt rejection",unit:"%",def:99.7,step:0.05,hint:"Set by the membrane model"}
])+
card("Membranes","Membrane model sets area, rejection and permeability.",[
{id:"mbrand",type:"sel",label:"Manufacturer",hint:"Datasheet library",opts:[["dupont","DuPont FilmTec"],["toray","Toray"],["hyd","Hydranautics"],["lg","LG Chem"],["custom","Custom"]]},
{id:"mmodel",type:"sel",label:"Membrane model",hint:"8-inch seawater elements",opts:[["x","x"]],for:"std"},
{id:"carea",label:"Element area",unit:"m²",def:40.9,step:0.1,hint:"Active area",for:"custom"},
{id:"cq",label:"Test permeate flow",unit:"m³/d",def:34,step:0.5,hint:"At 55.2 bar, 32,000 mg/L NaCl, 8%",for:"custom"},
{id:"crej",label:"Stabilized rejection",unit:"%",def:99.8,step:0.01,hint:"Datasheet value",for:"custom"},
{id:"ne",label:"Elements per vessel",unit:"no.",def:6,step:1,hint:"Default 6, typically 6–8"},
{id:"flux",label:"Max flux limit",unit:"LMH",def:18,step:0.5,hint:"Warning limit, typically 18 LMH"},
{id:"nv",label:"Pressure vessels",unit:"no.",def:230,step:1,hint:"Your design. Flux is calculated from it"},
{id:"pfmode",type:"sel",label:"Feed pressure",hint:"Auto = from membrane permeability",opts:[["auto","Auto (from membrane)"],["man","Manual"]]},
{id:"pf",label:"Feed pressure at membranes",unit:"bar",def:62,step:0.5,hint:"Must exceed brine π",for:"p_man"},
{id:"ff",label:"Fouling factor",unit:"",def:0.85,step:0.01,hint:"1.0 new · about 0.85 after 3 years"},
{id:"dpm",label:"Membrane ΔP (feed→brine)",unit:"bar",def:3,step:0.1,hint:"Typically 2–4 bar"},
{id:"pperm",label:"Permeate back pressure",unit:"bar",def:1,step:0.1,hint:"Usually 0.5–2 bar"}
],`<div class="fld" style="margin-top:10px"><label for="fluxc">Average flux (calculated)</label><div class="h">Permeate ÷ total membrane area, updates automatically</div><div class="row"><input id="fluxc" type="text" readonly style="text-align:left;font-weight:700"><span class="u">LMH</span></div></div><div class="desc" id="mspec" style="margin-top:6px;font-size:12px"></div>`)+
`</div>`+nav(null,1);

$("p1").innerHTML=`<div class="cards">`+
`<div class="card"><h2>Energy recovery device</h2><div class="why">Recovers brine pressure to cut HPP energy.</div>`+
fld({id:"erd",type:"sel",label:"ERD type",hint:"Changes the schematic and results",opts:[["px","Pressure Exchanger (PX)"],["turbo","Turbocharger"],["pelton","Pelton wheel"],["none","No ERD"]]})+
`<div class="desc" id="desc"></div>`+
[
{id:"lube",label:"PX lube / leakage flow",unit:"% of brine",def:2,step:0.1,hint:"Typically 1–3%",for:"px"},
{id:"mix",label:"PX mixing",unit:"%",def:3,step:0.1,hint:"Raises feed TDS, typically 1–3%",for:"px"},
{id:"dpx",label:"PX high-pressure ΔP",unit:"bar",def:1,step:0.1,hint:"0.5–1.5 bar",for:"px"},
{id:"et",label:"Turbine efficiency",unit:"%",def:82,step:0.5,hint:"Brine turbine",for:"turbo"},
{id:"etp",label:"Turbo pump efficiency",unit:"%",def:80,step:0.5,hint:"Feed booster impeller",for:"turbo"},
{id:"epl",label:"Pelton efficiency",unit:"%",def:85,step:0.5,hint:"Wheel + gearbox",for:"pelton"},

const GUIDE=[
["ابدأ من هنا: الفكرة في دقيقة",`<p>محطة تحلية مياه البحر بالتناضح العكسي (RO) بتاخد مياه بحر مالحة وبتضغطها بقوة على غشاء رفيع. الغشاء بيسمح للماء العذب بس بالمرور ويمنع الأملاح.</p><p>الناتج حاجتين: <b>مياه عذبة</b> (اسمها permeate)، و<b>مياه مالحة مركزة</b> (اسمها brine).</p><p><b>مثال بالأرقام:</b> عايز 1000 م³ في الساعة ماء عذب، ونسبة الاسترداد 45%. يبقى لازم تدخل الأغشية 2222 م³ في الساعة مياه بحر. الناتج: 1000 عذب و1222 brine. وملوحة الـ brine هتبقى تقريباً ضعف ملوحة البحر (من 38,000 لحوالي 69,000 mg/L).</p><p><b>ليه الضغط عالي؟</b> لأن المياه المالحة بتشد الماء العذب ناحيتها بقوة اسمها الضغط الأسموزي (π)، حوالي 27 bar لمياه البحر. فلازم ندفع بضغط أعلى منه: من 55 إلى 65 bar.</p><p><b>ليه الـ ERD؟</b> الـ brine بيخرج وضغطه لسه من 55 إلى 60 bar. لو اتصرف ضاعت طاقة كبيرة، فبنستخدم جهاز استرجاع الطاقة (ERD) يرجّع الضغط ده للتغذية.</p>`],
["رموز المعادلات (اقرأها أول)",`<ul><li><b>Qp:</b> تدفق الماء العذب المنتج</li><li><b>Qf:</b> تدفق التغذية الداخلة للأغشية</li><li><b>Qc:</b> تدفق الـ brine الخارج</li><li><b>Pf:</b> ضغط التغذية عند الأغشية</li><li><b>Pc:</b> ضغط الـ brine الخارج</li><li><b>r:</b> الاسترداد (الماء العذب ÷ التغذية)</li><li><b>π:</b> الضغط الأسموزي</li><li><b>ΔP:</b> فاقد الضغط</li><li><b>η:</b> الكفاءة</li></ul><p>باقي الاختصارات كلها في تبويب Abbreviations جنبه.</p>`],
["1. المأخذ (Intake)",`<p>المكان اللي بنسحب منه مياه البحر. فيه نوعين:</p><ul><li><b>مأخذ مفتوح (Open intake):</b> ماسورة سحب في البحر مع شبك (screens) ومضخات. إنتاجه كبير، لكن المياه فيها عكارة وطحالب فتحتاج تنقية أقوى.</li><li><b>بئر ساحلي (Beach well):</b> بئر جنب البحر والرمل بيصفّي المياه طبيعياً. المياه أنظف، الكيماويات أقل، ومبيأذيش الكائنات البحرية. عيبه: الإنتاج محدود بطبيعة الأرض، وممكن يظهر فيه حديد ومنجنيز (Fe وMn) وغاز كبريتيد الهيدروجين (H₂S).</li></ul>`],
["2. المعالجة الأولية (Pretreatment)",`<p>الهدف: تنظيف المياه قبل الأغشية لحمايتها. المقياس اللي بنعتمد عليه هو SDI (مؤشر الانسداد) ولازم يكون أقل من 3.</p><ul><li><b>الكلورة:</b> إضافة كلور لمنع نمو الكائنات الحية في خطوط السحب.</li><li><b>SBS (بيسلفيت الصوديوم):</b> بيشيل الكلور بعد كده، لأن الكلور بيتلف الأغشية.</li><li><b>Coagulation وFlocculation:</b> إضافة مادة (زي FeCl₃) بتخلي الشوائب الصغيرة تتجمع وتبقى كبيرة.</li><li><b>DAF:</b> تعويم بالهواء بيشيل الطحالب والزيوت.</li><li><b>فلاتر الرمل (Media filters) أو UF:</b> بيشيلوا العكارة. الـ UF أدق.</li><li><b>Antiscalant:</b> مادة بتمنع ترسيب الأملاح على الأغشية.</li><li><b>ضبط pH:</b> بالحمض عند الحاجة.</li></ul>`],
["2ب. سلسلة المعالجة الأولية في الأداة",`<p>الأداة بتمثل المسار كله من البئر لحد الـ HPP، وتقدر تحدد عدد كل جهاز من تبويب Equipment أو بالضغط عليه في الرسم:</p><p><b>بئر ساحلي ← غاطسات (Well pumps) ← خزان فيد (Feed tank) ← مضخات فيد (Feed pumps) ← فلاتر رمل (Sand filters) ← فلاتر Cartridge ← HPP</b></p><ul><li><b>Duty وStandby:</b> التدفق بيتوزع على الشغال بس، والاحتياطي ما بيستهلكش في الحساب.</li><li><b>الغاطسات:</b> كل غاطسة بتشيل تدفق = التدفق الكلي ÷ عدد الشغال. والقدرة:</li></ul><div class="fm">kW = Q × H / (356 × η)</div><p>(Q بـ م³/س و H رأس المضخة بالمتر).</p><ul><li><b>الخزان:</b> الحجم = التدفق × زمن البقاء.</li></ul><div class="fm">V = Qf × t / 60</div><ul><li><b>Feed pumps:</b> الضغط المطلوب بيتحسب من احتياج الـ HPP والفواقد:</li></ul><div class="fm">ΔP = P_HPP,suction + ΔP_sand + ΔP_cartridge + ΔP_piping − P_tank</div><div class="fm">kW = Q × ΔP / (36 × η_pump × η_motor)</div><ul><li><b>فلاتر الرمل:</b> سرعة الترشيح للفلاتر الشغالة:</li></ul><div class="fm">Rate = Q / ((N − standby) × Area)</div><p>الحد المعتاد 8–12 m/h، وبتظهر رسالة لو عدّى الحد.</p><ul><li><b>Cartridge:</b> التدفق على كل cartridge = التدفق ÷ (عدد الأوعية × عدد الـ cartridges). الحد 3 م³/س لكل cartridge 40 بوصة قيمة تصميم نموذجية وتقدر تغيرها.</li><li>الضغوط محسوبة عند أسوأ حالة (ΔP وقت الغسيل أو تغيير الفلتر)، فاستهلاك المضخات متحفظ.</li><li>طاقة الغاطسات والـ feed pumps بتدخل في استهلاك المحطة الكلي (SEC)، وبيظهروا منفصلين في توزيع الطاقة.</li></ul>`],
["2ج. نظام الحقن الكيماوي (Dosing)",`<p>الأداة بتمثل نظام الحقن في 3 نقاط، وتحسب الاستهلاك والمضخات والتخزين والتكلفة لكل مادة. الضبط من تبويب Dosing أو بالضغط على نقطة الحقن (البنفسجية) في الرسم.</p><ul><li><b>خزان الفيد (البداية):</b> هيبوكلوريت الصوديوم للتعقيم، وممكن مادة تخثير FeCl₃.</li><li><b>قبل الـ cartridge:</b> SBS لإزالة الكلور قبل الأغشية، وantiscalant، وحمض لو محتاج ضبط pH.</li><li><b>بعد الأغشية (النهاية):</b> جير مع CO₂ لإعادة التمعدن، وهيبوكلوريت للتعقيم، وصودا كاوية لضبط pH لو لزم.</li></ul><p>الجرعة بالـ mg/L من المادة الفعالة. الصفر يعني المادة مش بتتحقن. المواد قبل الأغشية بتتحسب على تدفق التغذية، والمواد بعدها على تدفق المنتج.</p><div class="fm">Active (kg/h) = Q × Dose / 1000</div><div class="fm">Product (kg/h) = Active / Strength</div><div class="fm">Product (L/h) = Product (kg/h) / Density</div><div class="fm">Pump (L/h) = Product (L/h) × (1 + margin)</div><div class="fm">Storage (t) = Product (kg/h) × 24 × days / 1000</div><div class="fm">Cost = tonnes per year × price</div><ul><li>الـ SBS غالباً 3 mg/L لكل 1 mg/L كلور.</li><li>الأسعار اللي في الأداة قيم مبدئية، حط أسعارك.</li><li>الأداة لا تحسب كيماويات الغسيل (CIP) ولا طاقة مضخات الحقن (صغيرة جداً).</li></ul>`],
["2د. الطلمبات: حساب بالكفاءة أو ببيانات الطلمبة",`<p>لكل طلمبة (الغاطسة، الـ feed، الـ HPP، الـ booster في الـ PX) فيه اختياران في كارت <b>Pump ratings</b> بتبويب Equipment:</p><ul><li><b>Calculated from efficiency:</b> الأداة تحسب القدرة من التدفق والضغط والكفاءة.</li><li><b>Entered pump data:</b> إنت بتدخل بيانات الطلمبة الفعلية من الـ pump curve أو النشرة: التدفق المقنن والضغط (أو الرأس) المقنن لكل طلمبة، والقدرة الكهربائية اللي بتسحبها عند نقطة التشغيل (kW)، وعدد الطلمبات في الـ HPP والـ booster.</li></ul><p><b>الحساب:</b> القدرة الكلية = القدرة لكل طلمبة × عدد الطلمبات الشغالة. ودي اللي بتدخل في الـ SEC وتوزيع الطاقة والتقارير.</p><div class="fm">P_total = P_each × number of duty pumps</div><p><b>الفحص:</b> الأداة بتقارن المطلوب بالمقنن، وبتظهر رسالة لو الطلمبة أضعف من المطلوب:</p><ul><li>التدفق المطلوب لكل طلمبة ≤ التدفق المقنن.</li><li>الضغط أو الرأس المطلوب ≤ المقنن.</li><li><b>الكفاءة الضمنية</b> = القدرة الهيدروليكية ÷ القدرة المدخلة. لو خرجت من 40% لـ 95% بتظهر رسالة تراجع فيها البيانات.</li></ul><div class="fm">Implied efficiency = (Q × ΔP / 36) / P_input</div><p><b>ملاحظات:</b></p><ul><li>الـ HPP في وضع Entered بينطبق على الـ ERD المختار بس. جدول المقارنة بيستخدم الحساب بالكفاءة للأنواع التانية.</li><li>مع الـ Pelton ادخل القدرة الصافية اللي الموتور بيسحبها بعد استرجاع الطاقة. ومع الـ Turbocharger ادخل قدرة الـ HPP عند الضغط المخفض.</li><li>القدرة المدخلة لازم تكون عند نقطة التشغيل الفعلية مش القدرة الاسمية للموتور.</li></ul>`],
["3. فلتر الخرطوشة (Cartridge filter)",`<p><b>إيه هو؟</b> فلتر 5 ميكرون بيجي بعد فلاتر الرمل ومباشرة قبل الـ HPP. شغلته حماية أخيرة للمضخة والأغشية من أي جسيمات صغيرة عدّت من فلاتر الرمل. الشمعات (cartridges) بتتغير ولا بتتنضف. كل فلتر عبارة عن وعاء (housing) جواه عدد كبير من الشمعات طول الواحدة 40 بوصة.</p><p><b>المدخل الوحيد:</b> عدد الفلاتر (Cartridge filters). والأداة بتحسب الباقي لوحدها:</p><div class="fm">Cartridges needed = Qf / 3 m³/h</div><div class="fm">Cartridges per filter = ceil( needed / filters ), rounded up to a multiple of 5</div><div class="fm">Total cartridges = filters × cartridges per filter</div><div class="fm">Flow per cartridge = Qf / Total cartridges</div><p><b>مثال بالأرقام:</b> تدفق التغذية 2,222 م³/س. عدد الشمعات المطلوب = 2,222 ÷ 3 = 741 شمعة. لو إنت حطيت 6 فلاتر، يبقى كل فلتر 741 ÷ 6 = 123.5، بنقرّبها لـ 125 شمعة. الإجمالي 750 شمعة، والتدفق على كل شمعة 2.96 م³/س.</p><p><b>افتراضات ثابتة في الأداة:</b> أساس التصميم 3 م³/س لكل شمعة 40 بوصة (قيمة شائعة)، وفاقد الضغط وقت التغيير 1 bar، وبنغير الشمعات لما يوصل لده. الـ ΔP ده بيتحسب بيه ضغط الـ feed pumps. راجع عدد الشمعات في كل وعاء مع نشرة المصنع اللي هتشتري منه.</p><p>تحت كارت الفلتر في تبويب Equipment بتلاقي الأرقام دي محسوبة لحظة بلحظة.</p>`],
["4. مضخة الضغط العالي (HPP)",`<p>بترفع ضغط المياه لـ 55–70 bar. كفاءتها 80–88% (يعني جزء بسيط من الكهرباء بيضيع حرارة). وغالباً بنتحكم في سرعتها بمحول تردد (VFD). هي أكبر مستهلك للكهرباء في المحطة.</p>`],
["5. أجهزة استرجاع الطاقة (ERD)",`<p>الـ brine بيخرج بضغط عالي. الـ ERD بيرجّع الضغط ده للتغذية بدل ما يضيع. فيه 3 أنواع:</p><ul><li><b>PX (مبادل الضغط):</b> بيشتغل بالتوازي مع الـ HPP. جوه الـ PX فيه rotor فيه قنوات: الـ brine بيدخل قناة ويدفع مياه بحر جديدة اتحطت فيها قبل كده، فالمياه دي بتتضغط وتروح للأغشية. الـ brine بعدها يخرج بضغط منخفض للتصريف. كفاءته 95–98%، وبعده مضخة صغيرة اسمها booster تكمل الضغط للأغشية. فيه اختلاط بسيط (1–3%) بين الـ brine ومياه البحر.</li><li><b>Turbocharger:</b> بيتركب بعد الـ HPP وقبل الأغشية. فيه توربين على خط الـ brine ومضخة على نفس العمود. الـ brine بيلف التوربين، والتوربين بيلف المضخة اللي بتزود ضغط التغذية. كفاءته 60–75%، وبيخلي الـ HPP يشتغل بضغط أقل.</li><li><b>Pelton wheel:</b> نفاث الـ brine بيلف عجلة متوصلة بعمود الـ HPP، فبتقلل الشغل اللي الموتور بيعمله. كفاءتها 80–88%.</li></ul><p><b>بدون ERD:</b> الـ brine بيتصرف بضغطه، فالاستهلاك أعلى.</p><p><b>مهم:</b> في الـ Pelton والـ Turbocharger الـ brine مبيدخلش في المياه الداخلة خالص، الطاقة بتتنقل بعمود ميكانيكي.</p>`],
["5ب. الـ brine بيرجع إزاي؟ وهل بيزوّد الملوحة؟",`<p><b>الـ brine مبيرجعش للمضخة ولا للأغشية.</b> اللي بيرجع ضغطه بس، والماء نفسه بيتصرف.</p><ul><li><b>Pelton وTurbocharger:</b> الـ brine بيلف عجلة أو توربين وبعدها يخرج للتصريف. الطاقة بتتنقل بعمود ميكانيكي، فمفيش أي اختلاط بين الـ brine ومياه التغذية، والملوحة ما بتتأثرش.</li><li><b>PX:</b> جوه الـ rotor فيه قنوات. الـ brine بيدخل قناة ويدفع مياه بحر <b>جديدة</b> كانت فيها، فالمياه دي بتتضغط وتروح للأغشية. الـ brine نفسه بيخرج بضغط منخفض للتصريف. يعني اللي بيدخل الأغشية مياه بحر مضغوطة مش brine.</li></ul><p><b>فيه اختلاط بسيط في الـ PX:</b> الفاصل بين الـ brine ومياه البحر في القناة مش مثالي، فبيحصل mixing حوالي 1–3% وتسرب صغير (lube flow). ده بيزوّد ملوحة التغذية شوية: مع mixing 3% وملوحة 39,000 mg/L بتزيد حوالي 500 mg/L بس. الأداة بتحسبها (خانة Feed TDS rise عند الـ PX في Schematic)، وبترفع الضغط المطلوب شوية، لكن مكسب استرجاع الطاقة أكبر منه بكتير.</p>`],
["6. وحدة الأغشية (RO)",`<ul><li>أغشية قطرها 8 بوصة ملفوفة (spiral-wound) من مادة polyamide.</li><li>بتتركب جوه أنابيب ضغط اسمها vessels من الفايبر (FRP)، وفي كل vessel من 7 إلى 8 عناصر.</li><li><b>Flux:</b> كمية الماء لكل م² غشاء في الساعة (LMH). إنت بتحدد عدد الـ vessels والـ flux بيتحسب منه، وتظهر رسالة لو عدّى 18 LMH.</li><li><b>رفض الأملاح (Rej):</b> أكبر من 99.7%.</li><li>فاقد الضغط من 1 إلى 4 bar لكل vessel.</li><li>لازم صافي الضغط الدافع (NDP) عند المخرج يبقى موجب، وإلا الإنتاج يقف في آخر العناصر.</li></ul>`],
["6ب. اختيار الغشاء والـ flux وضغط التغذية",`<p>اختار الماركة والموديل من تبويب Plant Data، والأداة بتاخد من نشرة المصنع: مساحة العنصر، نسبة رفض الأملاح، وتدفق الاختبار وظروفه.</p><p><b>1) نفاذية الغشاء (A value):</b> بتتحسب من بيانات الاختبار. تدفق الاختبار ÷ المساحة = flux الاختبار، وبنقسمه على صافي الضغط وقت الاختبار.</p><div class="fm">A = Jtest / (Ptest − π_avg,test)</div><p><b>2) عدد الـ vessels:</b> إنت اللي بتحدده. والأداة بتحسب الـ flux منه:</p><div class="fm">Flux = Qp × 1000 / (vessels × elements × area)</div><p>لو الـ flux عدّى الحد (18 LMH) بتظهر رسالة، وتحت اختيار الغشاء مكتوب أقل عدد vessels يحقق الحد.</p><p><b>3) ضغط التغذية:</b> بيتحسب عنصر بعنصر جوه الـ vessel. كل عنصر بيطلع flux حسب صافي الضغط عنده:</p><div class="fm">J = A × TCF × FF × NDP</div><div class="fm">TCF = exp( 2640 × (1/298 − 1/(273 + T)) )</div><p>أول عنصر بياخد أعلى flux، وكل ما نمشي ملوحة المياه بتزيد وصافي الضغط بيقل (وفيه β للتركيز عند السطح)، فآخر عنصر بياخد أقل flux. الأداة بتغير الضغط لحد ما مجموع الإنتاج يساوي الإنتاج المطلوب.</p><p><b>4) معامل الاتساخ (FF):</b> هامش تصميم. 1.0 للغشاء الجديد وحوالي 0.85 بعد 3 سنين. كل ما قلّ، الضغط المطلوب بيزيد.</p><p><b>الموديلات المتاحة وظروف الاختبار (من نشرات المصنعين):</b></p><ul><li><b>DuPont FilmTec:</b> SW30HRLE-440 (بياناته من نشرة DuPont اللي رفعتها، Rev. 5 مارس 2026، وفيها حدود التشغيل: ضغط أقصى 83 bar وفاقد ضغط 1.0 bar للعنصر و3.5 للـ vessel)، وSW30HRLE وSW30XLE وSW30ULE وSW30XHR بمقاسي 440i و400i، وSW30HR-380 (مياه بحر)، وBW30-400/34i وBW30HRLE-440 وXLE-440 (مياه مالحة). اختبار مياه البحر: 32,000 mg/L عند 55.2 bar واسترداد 8%، والـ ULE عند 48.3 bar.</li><li><b>Toray:</b> TM820V وTM820M بمقاسي 440 و400، وTMH20A (مياه مالحة).</li><li><b>Hydranautics:</b> SWC5 MAX وSWC4 MAX وSWC6 MAX وSWC6-LD. اختبارها باسترداد 10%، والـ SWC6 عند 41.4 bar.</li><li><b>LG Chem:</b> SW 440 SR G2 وSW 400 SR G2.</li></ul><p>الأرقام مأخوذة من نشرات منشورة، وبعضها نسخ مختلفة من نفس الموديل بتدي قيم قريبة. راجعها بآخر نشرة قبل أي تصميم نهائي. ولو الموديل عندك مش موجود، اختار Custom وادخل بياناته.</p><p><b>ملاحظة:</b> برنامج WAVE خاص بـ DuPont. الأداة بتقلد طريقة اختيار الغشاء وعرض التقرير، لكنها مش بديل عنه.</p>`],
["6ج. تقرير على طريقة WAVE",`<p>من زرار Export اختار <b>WAVE-style system report</b>. التقرير بنفس ترتيب تقارير WAVE تقريباً:</p><ul><li>بيانات المشروع، والمياه الداخلة، وأداء النظام (ضغط، flux، استهلاك الطاقة).</li><li>رسم تدفق النظام.</li><li>بيانات المرحلة: عدد الـ vessels والعناصر، وتدفق كل vessel، وأعلى وأقل flux.</li><li>جدول <b>عنصر بعنصر</b> لكل vessel: التدفق والضغط والملوحة والـ flux وNDP وβ ونسبة الاسترداد.</li><li>ملخص الطاقة.</li><li>مراجعة حدود التصميم (OK أو CHECK).</li></ul><p>الأداة <b>لا</b> تحسب تحليل الأيونات ومؤشرات الترسيب (LSI وSDSI وCaSO₄ وBaSO₄ وSiO₂). دي بتحتاج تحليل مياه كامل في WAVE.</p>`],
["7. المعالجة اللاحقة (Post-treatment)",`<p>المياه المنتجة تقريباً بدون معادن فهي أكالة للمواسير. فبنعمل:</p><ul><li>إضافة معادن (Remineralization) بالكالسيت وثاني أكسيد الكربون أو الجير.</li><li>ضبط pH ومؤشر LSI عشان المياه متترسبش ومتأكلش.</li><li>تعقيم بالكلور.</li><li>مرحلة تحلية ثانية (second pass) لو البورون محتاج تقليل.</li><li>تخزين.</li></ul>`],
["8. تصريف الـ brine",`<p>الـ brine بيتصرف للبحر في خط (outfall) آخره فتحات متعددة اسمها diffusers عشان الملوحة تتخفف بسرعة وتقل الأضرار البيئية. أحياناً بنعادل أو نشيل الكلور وكيماويات الغسيل قبل التصريف.</p>`],
["9. الأنظمة المساعدة",`<ul><li><b>CIP:</b> غسيل كيماوي للأغشية (حمضي أو قلوي) بدون فكها.</li><li><b>Flushing:</b> شطف الأغشية بمياه منتجة عند الإيقاف لمنع الترسيب.</li><li><b>Dosing:</b> حقن الكيماويات (antiscalant وSBS وحمض).</li><li>أجهزة قياس (ضغط وتدفق وتوصيلية) وخزانات.</li></ul>`],
["10. فروق الضغط في الدورة",`<ul><li><b>ضغط التغذية (Pf):</b> من 55 إلى 65 bar.</li><li><b>الضغط الأسموزي للتغذية (π):</b> حوالي 25–30 bar.</li><li><b>الضغط الأسموزي للـ brine:</b> حوالي 55 bar عند استرداد 45%.</li><li><b>فاقد الضغط داخل الأغشية:</b> من 1 إلى 4 bar، فضغط الـ brine الخارج يساوي Pf ناقص الفاقد.</li><li><b>فلتر الخرطوشة:</b> من 0.2 إلى 1 bar.</li><li><b>فلاتر الرمل:</b> من 0.3 إلى 1 bar.</li><li><b>داخل الـ PX:</b> من 0.5 إلى 1.5 bar، والـ booster بيعوضه.</li></ul><p>صافي الضغط الدافع (NDP):</p><div class="fm">NDP = Pf − ΔP/2 − π_avg − P_perm</div><p>π_avg متوسط الضغط الأسموزي بين التغذية والـ brine، وP_perm الضغط على جانب الماء المنتج.</p>`],
["11. الموازنة الهيدروليكية (توازن التدفقات)",`<p>تدفق التغذية = المنتج + الـ brine:</p><div class="fm">Qf = Qp + Qc</div><p>الاسترداد (نسبة الماء العذب):</p><div class="fm">r = Qp / Qf</div><p>ملوحة الـ brine (Rej رفض الأملاح):</p><div class="fm">Cc = Cf × (1 − r×(1 − Rej)) / (1 − r)</div><p>مع الـ PX: المضخة تشتغل بتدفق المنتج + جزء التسرب فقط.</p><div class="fm">Q_HPP = Qp + Q_lube</div><div class="fm">Q_HP-out = Qc − Q_lube</div>`],
["12. حساب الطاقة",`<p>القدرة اللازمة لمضخة (Q بـ م³/س و ΔP بـ bar):</p><div class="fm">kW = Q × ΔP / (36 × η)</div><p>الطاقة النوعية بدون ERD (kWh لكل م³ ماء):</p><div class="fm">SEC = Pf / (36 × η × r)</div><p><b>PX:</b> الـ HPP عند تدفق Q_HPP، والـ booster عند Q_HP-out.</p><p><b>Turbocharger:</b> الضغط المضاف للتغذية:</p><div class="fm">ΔP_boost = η_t × η_p × Qc × (Pc − Pd) / Qf</div><p>والـ HPP يشتغل عند Pf − ΔP_boost.</p><p><b>Pelton:</b> الطاقة المسترجعة:</p><div class="fm">Qc × (Pc − Pd) / 36 × η</div><p>وبتتخصم من شغل الـ HPP.</p><p>الكهرباء الفعلية = شغل العمود ÷ كفاءة الموتور. وSEC المحطة = SEC الـ RO + طاقة المأخذ والمعالجة (Aux).</p>`],
["13. افتراضات الأداة",`<ul><li>الضغط الأسموزي تقريب بسيط: 0.77 bar لكل g/L ومعدل بالحرارة.</li><li>اختلاط الـ PX بيتحسب بالتكرار لحد ما الأرقام تستقر.</li><li>ضغط التغذية بيتحسب تلقائياً عنصر بعنصر من نفاذية الغشاء (A value) مع تصحيح الحرارة ومعامل الاتساخ، لحد ما إنتاج الـ vessels يساوي الإنتاج المطلوب. وممكن تدخله يدوي.</li><li>أرقام الأغشية من نشرات المصنعين (ظروف اختبار قياسية) وبتحتاج مراجعة بآخر نشرة.</li><li>الأداة لا تحسب: فاقد الأنابيب، اتساخ الأغشية بمرور الوقت، الغسيل الكيماوي، ولا فاقد الضغط في المعالجة الأولية.</li><li>راجع الأرقام النهائية ببرامج الشركات المصنعة (ROSA أو WAVE أو IMSDesign) قبل التنفيذ.</li></ul>`],
["13ب. Other auxiliaries (الطاقة الإضافية)",`<p><b>معناها:</b> كل كهرباء بتستهلكها المحطة غير اللي الأداة بتحسبه لوحده. الأداة بتحسب لوحدها: مضخة الـ HPP والـ booster والـ ERD والغاطسات والـ feed pumps. أما Other auxiliaries فهي الباقي.</p><p><b>بتشمل مثلاً:</b></p><ul><li>مضخات المياه المنتجة (نقل وتخزين وضخ للشبكة) ومضخات المعالجة اللاحقة.</li><li>مضخات الغسيل العكسي لفلاتر الرمل والـ blowers.</li><li>مضخات CIP والـ flushing.</li><li>مضخات الحقن والخلاطات.</li><li>الإضاءة والتكييف وأجهزة التحكم (SCADA) والمبنى.</li><li>مضخات التصريف.</li></ul><p><b>الوحدة:</b> kWh لكل م³ ماء منتج. المعتاد من 0.1 إلى 0.4. القيمة الافتراضية 0.15 للبئر الساحلي و0.3 للمأخذ المفتوح، وبتتغير تلقائياً لما تختار نوع المأخذ، وتقدر تكتب قيمتك بنفسك. لو عندك أحمال معروفة، اجمعها بالـ kW وقسمها على الإنتاج.</p><p><b>بتدخل في الحساب إزاي:</b></p><div class="fm">P_aux (kW) = Other auxiliaries × Qp</div><div class="fm">SEC plant = SEC RO + SEC pretreatment + Other auxiliaries</div><p><b>مثال:</b> 0.15 kWh/م³ × 1000 م³/س = 150 kW بتتضاف على استهلاك المحطة الكلي، وبتظهر في توزيع الطاقة باسم Other auxiliaries.</p>`],
["14. إزاي تستخدم الأداة",`<ul><li><b>Plant Data:</b> اختار المياه والإنتاج والأغشية.</li><li><b>Equipment:</b> اختار الـ ERD والمضخات والتكلفة.</li><li><b>Schematic:</b> رسم تفاعلي. دوس على أي جهاز تشوف قيمه وتعدّل مدخلاته.</li><li><b>Results:</b> الطاقة والتدفقات.</li><li><b>Pressure Map:</b> الضغط في كل نقطة.</li><li><b>ERD Compare:</b> مقارنة الأنواع الأربعة.</li><li><b>Export:</b> تقرير كامل، تقرير بنفس ترتيب برنامج WAVE، ملف Excel، وصورة الرسم.</li></ul>`]

 ].concat(mbl.tmax?[["Feed temperature",v.temp,"≤ "+f(mbl.tmax,0)+" °C",v.temp<=mbl.tmax,1]]:[]);
 d.alerts=[];
 LS.rc.forEach(r=>{if(!r.ok)d.alerts.push([false,r.rat===null?r.g+": implied efficiency "+f(r.req,1)+"% looks unrealistic.":r.g+": rated "+r.l.toLowerCase()+" "+f(r.rat,r.d)+" "+r.u+" is below the required "+f(r.req,r.d)+" "+r.u+"."])});

 if(flux>v.flux+0.05)d.alerts.push([false,`Average flux ${f(flux,1)} LMH exceeds the max flux of ${f(v.flux,1)} LMH.`]);
 if(s.Cc>75000)d.alerts.push([false,`Brine TDS ${f(s.Cc,0)} mg/L is very high — check scaling limits.`]);

 if(!d.alerts.length)d.alerts.push([true,"Operating point is within typical SWRO limits."]);
 return d;

const pi=(C,T)=>0.77*C/1000*(T+273.15)/298.15;
const f=(x,d=2)=>isFinite(x)?x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";

function pretreat(v,Qf){
 const wq=Qf/Math.max(1,v.wn),wk=v.wmode==="ent"?v.wk_r*v.wn:Qf*v.wh*1030*9.81/3.6e6/(v.we/100);
 const tank=Qf*v.tt/60;
 const p1=v.hs+v.sdp+v.cdp+v.pl,fdp=Math.max(0,p1-v.th),fq=Qf/Math.max(1,v.fn),fk=v.fmode==="ent"?v.fk_r*v.fn:Qf*fdp/36/(v.fe/100)/(v.em/100);
 const sop=Math.max(1,v.sn-v.ss),rate=Qf/(sop*v.sa);
 const need=Math.ceil(Qf/v.cm),cph=Math.max(1,Math.ceil(need/Math.max(1,v.cn)/5)*5),ncart=Math.max(1,v.cn)*cph,cflow=Qf/ncart;
 return {wq,wk,tank,p1,fdp,fq,fk,sop,rate,need,cph,ncart,cflow,pwell:v.wh/10.197,kW:wk+fk};
}
function prof(v,Cf,Qf,Pf){
 const nv=v.nvu,ne=v.ne,rej=v.rej/100,Qv=Qf/nv,ae=v.ae;
 const k=v.mA*Math.exp(2640*(1/298.15-1/(273.15+v.temp)))*v.ff,dpe=v.dpm/ne;
 let Q=Qv,C=Cf,P=Pf,tot=0,sp=0;const el=[];
 for(let i=0;i<ne;i++){
  let q=0,Cc=C,Cpe=C*(1-rej),beta=1,ndp=0;
  for(let it=0;it<10;it++){
   const Cm=(C+Cc)/2;
   beta=Math.exp(0.7*q/Q);
   ndp=P-dpe/2-pi(Cm*beta,v.temp)-v.pperm;
   q=Math.min(Math.max(0,k*ndp)*ae/1000,Q*0.5);
   Cpe=Cm*beta*(1-rej);
   Cc=(C*Q-Cpe*q)/(Q-q);
  }
  el.push({i:i+1,Qf:Q,Pf:P,Cf:C,q,J:q*1000/ae,ndp,beta,y:q/Q*100,Qc:Q-q,Cc,Cp:Cpe,dp:dpe});
  tot+=q;sp+=Cpe*q;Q-=q;C=Cc;P-=dpe;
 }
 return {perm:tot*nv,el,Qc:Q*nv,Cc:C,Cp:tot?sp/tot:0,Pc:P,Qv};
}
function solve(v,type){
 const r=v.rec/100,rej=v.rej/100,Qp=v.qp,Qf=Qp/r,Qc=Qf-Qp;
 const eh=v.eh/100,eb=v.eb/100,em=v.em/100;
 const lube=type==="px"?v.lube/100*Qc:0;
 const Qho=type==="px"?Qc-lube:0;
 const Qh=Qf-Qho;
 const mix=type==="px"?v.mix/100:0;
 let Cf=v.tds,Cc=v.tds,Cpx=v.tds;
 for(let i=0;i<80;i++){
  Cc=Cf*(1-r*(1-rej))/(1-r);
  Cpx=v.tds+mix*(Cc-v.tds);
  Cf=(Qh*v.tds+Qho*Cpx)/Qf;
 }
 const pif=pi(Cf,v.temp);
 const Jf=Qp*1000/(v.nvu*v.ne*v.ae),tcf=Math.exp(2640*(1/298.15-1/(273.15+v.temp)));
 let Pf=v.pf,unreach=false;
 if(v.pfa&&v.mA>0&&v.ff>0){
  let lo=10,hi=150;
  for(let i=0;i<48;i++){const mid=(lo+hi)/2;if(prof(v,Cf,Qf,mid).perm<Qp)lo=mid;else hi=mid}
  Pf=hi;unreach=prof(v,Cf,Qf,150).perm<Qp;
 }
 const pr=prof(v,Cf,Qf,Pf);
 let Cp=Cf*(1-rej);
 if(v.pfa&&!unreach){Cc=pr.Cc;Cp=pr.Cp}
 const pic=pi(Cc,v.temp),pia=(pif+pic)/2,Pc=Pf-v.dpm;
 const ndp=Pf-v.dpm/2-pia-v.pperm,ndpo=pr.el[pr.el.length-1].ndp;
 let Phpp=Pf,Ppxo=0,dPb=0,hppSh=0,boSh=0,rec=0,etaPx=0,pel=0;
 if(type==="none")hppSh=Qf*Pf/36/eh;
 if(type==="px"){
  Ppxo=Pc-v.dpx;dPb=Math.max(0,Pf-Ppxo);
  hppSh=Qh*Pf/36/eh;boSh=Qho*dPb/36/eb;
  etaPx=(Qho*Ppxo)/(Qc*Pc)*100;
 }
 if(type==="turbo"){
  dPb=(v.et/100)*(v.etp/100)*Qc*(Pc-v.pd)/Qf;
  Phpp=Pf-dPb;hppSh=Qf*Phpp/36/eh;
  rec=Qc*(Pc-v.pd)/36*(v.et/100);
 }
 if(type==="pelton"){
  rec=Qc*(Pc-v.pd)/36*(v.epl/100);
  hppSh=Qf*Pf/36/eh;pel=rec;
 }
 const entS=type===v.erd;
 let hppE=(hppSh-pel)/em,boE=boSh/em;
 if(entS&&v.hmode==="ent")hppE=v.hk_r*v.hcnt;
 if(entS&&v.bmode==="ent"&&type==="px")boE=v.bk_r*v.bcnt;
 const tot=hppE+boE;
 const pt=pretreat(v,Qf),secPT=pt.kW/Qp,secRO=tot/Qp,secT=secRO+secPT+v.aux;
 return {pt,secPT,pr,unreach,Jf,tcf,Qp,Qf,Qc,Qh,Qho,lube,Cf,Cc,Cp,Pf,Pc,Phpp,Ppxo,dPb,pif,pic,pia,ndp,ndpo,hppE,boE,tot,secRO,secT,etaPx,rec,pel,type};
}

  ["RO power",f(s.tot,0)+" kW","HPP "+f(s.hppE,0)+" · Boost "+f(s.boE,0)],
  ["Saving vs no ERD",f(sav,1)+" %",f(n.secRO)+" → "+f(s.secRO)],
  ["Energy",f(annualMWh,0)+" MWh/y",f(plantKW*24/1000,1)+" MWh/d"],
  ["Energy cost",f(cost/1e6,2)+" M EGP/y","@ "+f(v.tar)+" EGP/kWh"],
  ["Chemicals cost",f(LS.ch.cost/1e6,2)+" M EGP/y",f(LS.ch.perM3,2)+" EGP/m³"],
  ["Vessels / flux",f(v.nvu,0)+" · "+f(flux,1)+" LMH",f(v.nvu*v.ne,0)+" elements"],
  ["Permeate TDS",f(s.Cp,0)+" mg/L","RO feed "+f(s.Cf,0)]
 ].map(k=>`<div class="k"><span>${k[0]}</span><b>${k[1]}</b><br><small>${k[2]}</small></div>`).join("");

 const w=[];
 if(s.ndpo<0.5)w.push(["Outlet NDP is "+f(s.ndpo)+" bar. Increase feed pressure (use Auto-set in Plant Data) or reduce recovery."]);
 if(flux>v.flux+0.05)w.push(["Average flux "+f(flux,1)+" LMH exceeds the max flux of "+f(v.flux,1)+" LMH. Add vessels."]);
 if(s.Cc>75000)w.push(["Brine TDS "+f(s.Cc,0)+" mg/L is very high. Check scaling limits."]);
 if(s.pt.rate>v.smax)w.push(["Sand filter rate "+f(s.pt.rate,1)+" m/h exceeds "+f(v.smax,1)+" m/h. Add sand filters."]);
 if(s.pt.cflow>v.cm)w.push(["Cartridge flow "+f(s.pt.cflow,2)+" m³/h each exceeds "+f(v.cm,1)+" m³/h. Add cartridges."]);
 LS.rc.forEach(r=>{if(!r.ok)w.push([r.rat===null?r.g+": implied efficiency "+f(r.req,1)+"% looks unrealistic, check the entered data.":r.g+": rated "+r.l.toLowerCase()+" "+f(r.rat,r.d)+" "+r.u+" is below the required "+f(r.req,r.d)+" "+r.u+"."])});
 if(type==="px"&&s.dPb<=0)w.push(["Booster ΔP is zero. Check PX pressure inputs."]);
 $("alerts").innerHTML=w.length?w.map(a=>`<div class="al">${a[0]}</div>`).join(""):`<div class="al g">Operating point is within typical SWRO limits.</div>`;

 const rows=[["Permeate Qp",s.Qp,"m³/h"],["Membrane feed Qf",s.Qf,"m³/h"],["Brine Qc",s.Qc,"m³/h"],["HPP flow",type==="px"?s.Qh:s.Qf,"m³/h"]];
 if(type==="px")rows.push(["PX lube flow",s.lube,"m³/h"],["PX HP-out / booster flow",s.Qho,"m³/h"]);
 let h="<tr><th>Item</th><th>Value</th><th>Unit</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${f(r[1])}</td><td>${r[2]}</td></tr>`).join("");
 h+=`<tr><td>Seawater TDS</td><td>${f(v.tds,0)}</td><td>mg/L</td></tr><tr><td>RO feed TDS</td><td>${f(s.Cf,0)}</td><td>mg/L</td></tr><tr><td>Brine TDS</td><td>${f(s.Cc,0)}</td><td>mg/L</td></tr>`;
 if(type==="px")h+=`<tr><td>PX efficiency (Q·P)</td><td>${f(s.etaPx,1)}</td><td>%</td></tr>`;
 $("tFlow").innerHTML=h;

 const parts=[["HPP",s.hppE,""]];
 if(type==="px")parts.push(["PX booster",s.boE,""]);
 if(type==="turbo"||type==="pelton")parts.push(["Energy recovered (shaft)",s.rec,"o"]);
 parts.push(["Well pumps",s.pt.wk,""],["Feed pumps",s.pt.fk,""],["Other auxiliaries",v.aux*v.qp,""]);
 const mx=Math.max(...parts.map(x=>x[1]));
 $("bars").innerHTML=parts.map(x=>`<div class="bl"><div><span>${x[0]}</span><b>${f(x[1],0)} kW · ${f(x[1]/v.qp)} kWh/m³</b></div><div class="bar ${x[2]}"><i style="width:${x[1]/mx*100}%"></i></div></div>`).join("");

 const p=[];
 if(type==="none")p.push(["HPP discharge → membranes",s.Pf]);
 if(type==="px")p.push(["HPP discharge",s.Pf],["PX HP inlet (brine)",s.Pc],["PX HP outlet",s.Ppxo],["Booster discharge",s.Pf]);
 if(type==="turbo")p.push(["HPP discharge",s.Phpp],["Turbocharger discharge",s.Pf],["Turbine inlet (brine)",s.Pc],["Turbine outlet",v.pd]);
 if(type==="pelton")p.push(["HPP discharge",s.Pf],["Pelton inlet (brine)",s.Pc],["Pelton outlet",v.pd]);
 p.push(["Membrane feed inlet",s.Pf],["Membrane brine outlet",s.Pc],["Permeate",v.pperm]);
 const pm=Math.max(...p.map(x=>x[1]),1);
 let ph=p.map(x=>`<div class="bl"><div><span>${x[0]}</span><b>${f(x[1],1)} bar</b></div><div class="bar"><i style="width:${x[1]/pm*100}%"></i></div></div>`).join("");
 if(type==="px"||type==="turbo")ph+=`<div class="bl"><div><span>Boost ΔP</span><b>${f(s.dPb,1)} bar</b></div><div class="bar o"><i style="width:${s.dPb/pm*100}%"></i></div></div>`;
 $("pmap").innerHTML=ph;

 $("tOsm").innerHTML=`<tr><th>Item</th><th>bar</th></tr>
 <tr><td>π feed</td><td>${f(s.pif)}</td></tr>
 <tr><td>π brine</td><td>${f(s.pic)}</td></tr>
 <tr><td>π average</td><td>${f(s.pia)}</td></tr>
 <tr><td>Membrane ΔP</td><td>${f(v.dpm)}</td></tr>
 <tr><td>NDP average</td><td>${f(s.ndp)}</td></tr>
 <tr><td>NDP at outlet</td><td>${f(s.ndpo)}</td></tr>`;

 let c="<tr><th>ERD</th><th>HPP kW</th><th>Booster kW</th><th>Total kW</th><th>SEC RO</th><th>SEC plant</th><th>Saving</th><th>EGP M/y</th></tr>";
 ["none","px","turbo","pelton"].forEach(t=>{
  const a=all[t],sp=(1-a.tot/n.tot)*100,an=a.secT*v.qp*8760*v.av/100*v.tar/1e6;
  c+=`<tr class="${t===type?"sel":""}"><td>${NAMES[t]}</td><td>${f(a.hppE,0)}</td><td>${f(a.boE,0)}</td><td>${f(a.tot,0)}</td><td>${f(a.secRO)}</td><td>${f(a.secT)}</td><td>${f(sp,1)}%</td><td>${f(an,2)}</td></tr>`;
 });
 $("tCmp").innerHTML=c;
 const cm=Math.max(...["none","px","turbo","pelton"].map(t=>all[t].secRO));
 $("cbars").innerHTML=["none","px","turbo","pelton"].map(t=>`<div class="bl"><div><span>${NAMES[t]}</span><b>${f(all[t].secRO)} kWh/m³</b></div><div class="bar ${t===type?"":"o"}"><i style="width:${all[t].secRO/cm*100}%"></i></div></div>`).join("");
}

function applySrc(){const k=$("src").value;if(PRE.src[k]){setv("tds",PRE.src[k][0]);setv("temp",PRE.src[k][1])}}
function applyIntake(){const k=$("intake").value;if(PRE.intake[k]!==undefined)setv("aux",PRE.intake[k])}
function applyPump(){const k=$("pump").value;if(PRE.pump[k]){setv("eh",PRE.pump[k][0]);setv("eb",PRE.pump[k][1]);setv("em",PRE.pump[k][2])}}

$("src").onchange=()=>{applySrc();render()};
$("intake").onchange=()=>{applyIntake();render()};
$("pump").onchange=()=>{applyPump();render()};
["tds","temp"].forEach(i=>$(i).addEventListener("input",()=>{$("src").value="custom"}));
["aux"].forEach(i=>$(i).addEventListener("input",()=>{$("intake").value="custom"}));
["eh","eb","em"].forEach(i=>$(i).addEventListener("input",()=>{$("pump").value="custom"}));
$("unit").onchange=()=>{
 const d=$("unit").value==="d",c=$("cap");
 c.value=d?(parseFloat(c.value)||0)*24:(parseFloat(c.value)||0)/24;
 c.step=d?200:10;$("cap_u").textContent=d?"m³/day":"m³/h";
 render();
};
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",render));
document.querySelectorAll("select").forEach(e=>e.addEventListener("change",render));

function setTheme(){let t=$("theme").value;if(t==="auto")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"sea";document.documentElement.dataset.th=t}
$("theme").onchange=setTheme;
setTheme();
applySrc();applyIntake();applyPump();fillModels(true);
go(0);render();
</script>
</body>
</html>
